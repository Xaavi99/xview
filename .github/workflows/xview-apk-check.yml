name: Check xview APK

on:
  push:
    branches:
      - xview-check

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xview-android-arm64
          run-id: 38001863793
          github-token: ${{ github.token }}
          path: apk
      - name: Inspect
        shell: bash
        run: |
          set +e
          APK=$(ls apk/*.apk)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          note() { local t="$1"; shift; local body; body=$(cat | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'); echo "::notice title=$t::$body"; }
          { ls -l apk; sha256sum "$APK"; } | note "file"
          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | grep -v "^WARNING: META-INF" | note "apksigner"
          "$BT/aapt" dump badging "$APK" 2>&1 | grep -E "^package|sdkVersion|targetSdk|native-code|application-label:|^application:" | note "badging"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" 2>&1 | tail -3 | note "zipalign"
          unzip -l "$APK" | grep -E "lib/|resources.arsc|classes.dex" | note "contents"
          unzip -p "$APK" resources.arsc >/dev/null; unzip -v "$APK" resources.arsc lib/arm64-v8a/librustdesk.so 2>&1 | tail -4 | note "compression"
